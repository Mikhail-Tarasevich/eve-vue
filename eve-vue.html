<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>EVE</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
        <script src="https://unpkg.com/element-ui/lib/index.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
        <script src="settings.js"></script>
        <script src="objects/Asset.js"></script>
        <script src="components/PagePricePlex.js"></script>
        <script src="components/PageRight.js"></script>
        <script src="components/PageEmpty.js"></script>
        <script src="components/PageGoldenMykoserocin.js"></script>
        <script src="components/PageMalachiteMykoserocin.js"></script>
        <script src="components/PageLowgradeRaptureAlpha.js"></script>
        <script src="components/PageLowgradeRaptureDelta.js"></script>
        <script src="components/PageLowgradeRaptureGamma.js"></script>
        <script src="components/PageMidgradeNirvanaBeta.js"></script>
        <script src="components/PageMidgradeNirvanaGamma.js"></script>
        <script src="components/PageMidgradeRaptureBeta.js"></script>
        <script src="components/PageMidgradeRaptureGamma.js"></script>
        <script src="components/PageMobileDepot.js"></script>
        <script src="components/PageLPStateProtectorate.js"></script>
        <script src="components/PageBuyMinerals.js"></script>
        <script src="components/PageTest.js"></script>
    </head>
    <body>
        <div id="app" v-bind:style="styleApp">
            <div id="leftPage" v-bind:style="styleLeftPage">
                <button v-on:click="getPLEX">PLEX</button>
                <button v-on:click="getGoldenMykoserocin">Gas Golden Mykoserocin</button>
                <button v-on:click="getMalachiteMykoserocin">Gas Malachite Mykoserocin</button>
                <button v-on:click="getLowgradeRaptureAlpha">Implant Low-grade Rapture Alpha</button>
                <button v-on:click="getLowgradeRaptureDelta">Implant Low-grade Rapture Delta</button>
                <button v-on:click="getLowgradeRaptureGamma">Implant Low-grade Rapture Gamma</button>
                <button v-on:click="getMidgradeNirvanaBeta">Implant Mid-grade Nirvana Beta</button>
                <button v-on:click="getMidgradeNirvanaGamma">Implant Mid-grade Nirvana Gamma</button>
                <button v-on:click="getMidgradeRaptureBeta">Implant Mid-grade Rapture Beta</button>
                <button v-on:click="getMidgradeRaptureGamma">Implant Mid-grade Rapture Gamma</button>
                <button v-on:click="getMobileDepot">Mobile Depot</button>
                <button v-on:click="getLPStateProtectorate">LP State Protectorate</button>
                <button v-on:click="getBuyMinerals">Закупка минералов</button>
                <button v-on:click="getTest">TEST</button>
            </div>
            <component v-bind:is="rightcomponentname"></component>
        </div>
        
        <script>
            function formatNumber(num=0, numtype='decimal') {
                return new Intl.NumberFormat('ru-RU', {style: numtype, useGrouping: 'true', maximumFractionDigits: 2, minimumFractionDigits: 2}).format((num))
            }

            function getPrice(ordertype="sell", product="34", region="10000002", location=60003760) {
            return fetch('https://esi.evetech.net/dev/markets/'+region+'/orders/?datasource=tranquility&order_type='+ordertype+'&type_id='+product)
            .then(response => response.json())
            .then(commits => {
                                let commisionStation = .84;
                                let minprice = 0
                                if (ordertype=="buy") {
                                    minprice = 0
                                    for (let i=0; i <commits.length; i++) {
                                    if (minprice<commits[i].price && commits[i].location_id==location) {
                                        minprice = commits[i].price
                                    }
                                    }
                                    minprice = minprice * (1+commisionStation/100)
                                } else { // sell
                                    minprice = Number.MAX_SAFE_INTEGER
                                    for (let i=0; i <commits.length; i++) {
                                    if (minprice>commits[i].price && commits[i].location_id==location) {
                                        minprice = commits[i].price
                                    }
                                    }
                                }
                                return minprice;
                            });
            }

            var app = new Vue({
                el: '#app',
                data: {
                    actualrightcomponentname: 'page-empty',
                    styleApp: {
                        display: 'flex'
                    },

                    getPLEX: function() {
                        app.$data.actualrightcomponentname = 'page-price-plex';
                    },

                    getGoldenMykoserocin: function() {
                        app.$data.actualrightcomponentname = 'page-golden-mykoserocin';
                    },

                    getMalachiteMykoserocin: function() {
                        app.$data.actualrightcomponentname = 'page-malachite-mykoserocin';
                    },          

                    getLowgradeRaptureAlpha: function() {
                        app.$data.actualrightcomponentname = 'page-lowgrade-rapture-alpha';
                    },          

                    getLowgradeRaptureDelta: function() {
                        app.$data.actualrightcomponentname = 'page-lowgrade-rapture-delta';
                    },          

                    getLowgradeRaptureGamma: function() {
                        app.$data.actualrightcomponentname = 'page-lowgrade-rapture-gamma';
                    },          

                    getMidgradeNirvanaBeta: function() {
                        app.$data.actualrightcomponentname = 'page-midgrade-nirvana-beta';
                    },          

                    getMidgradeNirvanaGamma: function() {
                        app.$data.actualrightcomponentname = 'page-midgrade-nirvana-gamma';
                    },          

                    getMidgradeRaptureBeta: function() {
                        app.$data.actualrightcomponentname = 'page-midgrade-rapture-beta';
                    },          

                    getMidgradeRaptureGamma: function() {
                        app.$data.actualrightcomponentname = 'page-midgrade-rapture-gamma';
                    },          

                    getMobileDepot: function() {
                        app.$data.actualrightcomponentname = 'page-mobile-depot';
                    },          

                    getLPStateProtectorate: function() {
                        app.$data.actualrightcomponentname = 'page-lp-stateprotectorate';
                    },          

                    getBuyMinerals: function() {
                        app.$data.actualrightcomponentname = 'page-buy-minerals';
                    },          

                    getTest: function() {
                        app.$data.actualrightcomponentname = 'page-test';
                    },          
                    
                    styleLeftPage: {
                        width: '100px',
                        backgroundColor: '#f2f2f2',
                    },
                }, 
                computed: {
                    rightcomponentname: function() {
                        return this.$data.actualrightcomponentname;
                    }
                }
            })
        </script>
    </body>
</html>
